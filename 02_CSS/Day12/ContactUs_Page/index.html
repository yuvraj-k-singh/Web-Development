<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Page</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <main>
        <section class="contact-section">
            <div class="contact-container">
                <div class="left-container">
                    <div class="left-address">
                        <i class="fa-solid fa-location-dot"></i>
                        <h2>Address</h2>
                        <p>100B, Rajendra nagar, Indore (M.P)</p>
                    </div>
                    <div class="left-email">
                        <i class="fa-solid fa-envelope"></i>
                        <h2>Email Address</h2>
                        <p>YuvrajStudentBussiness@gmail.com</p>
                    </div>
                    <div class="left-phone">
                        <i class="fa-solid fa-phone"></i>
                        <h2>Phone</h2>
                        <p>
                            +91 8269465228
                            <br>
                            +91 7445686695
                        </p>
                    </div>
                </div>
                <div class="right-container">
                    <h1>Send us a message</h1>
                    <p>If you have any doubt related to our services, feel free to contact us! we are available 24 x 7 in your service</p>
                    <form action="#">
                        <input type="text" name="userName" id="userName" placeholder="Enter your name">
                        <br><br>
                        <input type="email" name="userEmail" id="userEmail" placeholder="Enter your email">
                        <br><br>
                        <textarea name="userMessage" id="userMessage" placeholder="Enter your message"></textarea>
                        <br><br>
                        <button type="submit">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
