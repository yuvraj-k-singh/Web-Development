<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card UI</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="main-section">
        <div class="card-container">
            <div class="chip">
                <img src="./images/chip.png" alt="card-chip">
            </div>
            <div class="card-logo">
                <img src="./images/logo.png" alt="logo">
                <h1>Master Card</h1>
            </div>
            <h2 class="card-no">
                Card Number
                <br>
                9868 5554 5668 2002
            </h2>
            <h3 class="card-name">Yuvraj Kumar Singh</h3>
            <h3 class="card-date">
                Valid Date
                <br>
                05/28
            </h3>
        </div>
    </section>
</body>
</html>
