<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Design</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <main>
        <h1>Welcome to, my website!</h1>
    </main>
    <footer>
        <div class="top-container">
            <div class="footer-logo">
                <a href="#" class="logo"><i class="fa-brands fa-gripfire"></i></a>
                <span><h2>Yuvraj Singh</h2></span>
            </div>
            <div class="footer-socialmedia">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-threads"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
        <div class="bottom-container">
            <div class="link-container">
                <h3>Company</h3>
                <ul>
                    <a href="#">Home</a>
                    <a href="#">Contact us</a>
                    <a href="#">About us</a>
                    <a href="#">Get started</a>
                </ul>
            </div>
            <div class="link-container">
                <h3>Service</h3>
                <ul>
                    <a href="#">App Design</a>
                    <a href="#">Logo Design</a>
                    <a href="#">Banner Design</a>
                    <a href="#">Web Design</a>
                </ul>
            </div>
            <div class="link-container">
                <h3>Account</h3>
                <ul>
                    <a href="#">Profile</a>
                    <a href="#">My account</a>
                    <a href="#">Purchase</a>
                    <a href="#">Balance</a>
                </ul>
            </div>
            <div class="link-container">
                <h3>course</h3>
                <ul>
                    <a href="#">JAVA</a>
                    <a href="#">Python</a>
                    <a href="#">C++</a>
                    <a href="#">DSA</a>
                </ul>
            </div>
            <div class="subscribe-container">
                <h3>Subscribe</h3>
                <div class="form-container">
                    <form action="#">
                        <input type="email" name="userEmail" id="userEmail" placeholder="Enter your email">
                        <button type="button">Subscribe</button>
                    </form>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
