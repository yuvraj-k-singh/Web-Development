<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card UI</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section class="main-section">
        <div class="profile-container">
            <div class="profile-img">
                <img src="./profile-card-img.jpg" alt="profile-img">
            </div>
            <div class="profile-text">
                <h1>Yuvraj Kumar Singh</h1>
                <p>Btech CSE Student</p>
            </div>
            <div class="media-btn">
                <a href="#" class="media-icons" style="background-image: linear-gradient(to top right, #FABC15, #96529F);">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="#" class="media-icons" style="background-color: #54B4E6;">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="#" class="media-icons" style="background-color: #2767B1;">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
                <a href="#" class="media-icons" style="background-color: #EF1D26;">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
            <div class="profile-btns">
                <button>Subscribe</button>
                <button>Message</button>
            </div>
            <div class="profile-popularity">
                <div class="data">
                    <i class="fa-solid fa-thumbs-up"></i>
                    <span>60k</span>
                </div>
                <div class="data">
                    <i class="fa-solid fa-comment"></i>
                    <span>20k</span>
                </div>
                <div class="data">
                    <i class="fa-solid fa-share"></i>
                    <span>120k</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
