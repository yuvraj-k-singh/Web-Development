<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Landing Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Header section -->
    <header>
        <nav>
            <a href="#" class="logo">YS Coffee</a>
            <ul class="nav-links">
                <li>Home</li>
                <li>About</li>
                <li>Menu</li>
                <li>Review</li>
                <li class="active">Cart 0</li>
            </ul>
        </nav>
    </header>

    <!-- Home Section -->
    <section class="home-section" id="home">
        <div class="text-box">
            <div class="text-area">
                <p>Chocolate Coffee</p>
                <h1>Chocolate.</h1>
                <h1>Eat.</h1>
                <h1>Repeat.</h1>
                <h2>Our mocha menu has 12 ways to enjoy chocolate and coffee together, made  fresh every morning.</h2>
            </div>
            <div class="btn-area">
                <a href="#" class="order">Order Now</a>
                <a href="#" class="story">Our Story</a>
            </div>
            <div class="review-area">
                <h3>Reviews</h3>
                <h3>Cups a week</h3>
                <h3>Mocha recipes</h3>
            </div>
        </div>
        <div class="img-box"></div>
    </section>
</body>
</html>
