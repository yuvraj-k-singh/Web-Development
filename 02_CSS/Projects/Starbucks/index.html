<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarBucks</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <!-- Header Section -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo"><img src="./logo.png" alt="starbucks-logo"></a>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Rewards</a></li>
            </ul>
            <div class="btn-container">
                <div class="location">
                    <a href="#"><i class="fa-solid fa-location-dot"></i>
                    <span>Find a cafe'</span></a>
                </div>
                <a href="#" class="sign-in">Sign in</a>
                <a href="#" class="join-now">Join now</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-container">
                <div class="hero-text">
                    <h1>It's not just Coffee</h1>
                    <h2>It's <span>StarBucks</span></h2>
                    <p>Starbucks is the world's largest coffeehouse chain, offering premium arabica coffee, handcrafted espresso beverages, loose-leaf teas, and a variety of fresh pastries and sandwiches.</p>
                    <div class="text-btncontainer">
                        <a href="#" >Learn More</a>
                    </div>
                </div>
                <div class="hero-img">
                    <figure>
                        <img src="./home-coffee.png" alt="StarBucks-hero">
                    </figure>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
