<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Practice 2</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            height: fit-content;
            width: 45%;
            padding: 65px 90px;
            border: 2px solid black;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .container input{
            height: 45px;
            width: 80%;
            padding: 0px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" name="text" id="text" placeholder="Type Here">
        <h2 id="h2">Welcome!</h2>
    <script src="./script.js"></script>
    </div>
</body>
</html>
