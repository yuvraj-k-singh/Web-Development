<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="form-container">
            <form action="#">
                <div class="text">
                    <div>
                        <label for="boyName">Boy Name</label>
                        <input type="text" name="boyName" id="boyName" placeholder="Boy Name" required>
                    </div>
                    <div>
                        <label for="girlName">Girl Name</label>
                        <input type="text" name="girlName" id="girlName" placeholder="Girl Name" required>
                    </div>
                </div>
                <div class="button">
                    <button type="submit">Calculate Love</button>
                </div>
            </form>
        </div>
        <div class="result">
            <h1>Result: <span><p style="display: inline-block;"> 0%</p></span></h1>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
