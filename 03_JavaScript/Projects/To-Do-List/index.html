<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main-container">
        <div class="text-container">
            <h1>The truly free <span>to do list!</span>
            </h1>
            <h2>Make a free to do list in 5 seconds. Share it with anyone, no signup or login required.</h2>
        </div>
        <form action="#">
            <div class="input-container">
                <input type="text" name="work" id="work">
                <button type="submit">Add Work</button>
            </div>
        </form>
        <div class="result-container">
            <h2 style="text-align: center; font-size: 2.2rem; font-weight: 600; color: blueviolet;">Result</h2>
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
